
<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
</head>
<body>

<h1>Registration Form</h1>

<form>

    First Name:
    <input type="text" name="firstname" required>
    <br><br>

    Last Name:
    <input type="text" name="lastname" required>
    <br><br>

    Date of Birth:
    <input type="date" name="dob" required>
    <br><br>

    Gender:
    <input type="radio" name="gender" value="Male" required> Male
    <input type="radio" name="gender" value="Female"> Female
    <input type="radio" name="gender" value="Other"> Other
    <br><br>

    Qualification:
    <select name="qualification" required>
        <option value="">Select Qualification</option>
        <option>SSLC</option>
        <option>Plus Two</option>
        <option>Diploma</option>
        <option>Degree</option>
        <option>Post Graduate</option>
    </select>
    <br><br>

    Address:
    <br>
    <textarea name="address" rows="4" cols="40" required></textarea>
    <br><br>

    State:
    <select name="state" required>
        <option value="">Select State</option>
        <option>Kerala</option>
        <option>Karnataka</option>
        <option>Tamil Nadu</option>
        <option>Andhra Pradesh</option>
        <option>Telangana</option>
    </select>
    <br><br>

    Pincode:
    <input type="text" name="pincode" pattern="[0-9]{6}" maxlength="6" required>
    <br><br>

    Email:
    <input type="email" name="email" required>
    <br><br>

    Phone:
    <input type="tel" name="phone" pattern="[0-9]{10}" maxlength="10" required>
    <br><br>

    Username:
    <input type="text" name="username" minlength="4" maxlength="20" required>
    <br><br>

    Password:
    <input type="password" name="password" minlength="8" required>
    <br><br>

    <input type="submit" value="Register">
    <input type="reset" value="Clear">

</form>

</body>
</html>
